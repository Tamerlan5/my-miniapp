    <!-- UPGRADES (АПГРЕЙДЕР) -->
    <section id="page-boosts" class="page">
      <h2>Апгрейдер</h2>
      
      <!-- Контейнер с колесом -->
      <div class="upgrader-container">
        <!-- Колесо -->
        <div class="wheel-wrapper">
          <svg class="wheel-svg" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="gradYellow" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffe066" />
                <stop offset="100%" stop-color="#f5b700" />
              </linearGradient>
              <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff4d4d" />
                <stop offset="100%" stop-color="#990000" />
              </linearGradient>
            </defs>
            
            <!-- Фоновое кольцо -->
            <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8"/>
            
            <!-- Дуга (заполняется в зависимости от шанса) -->
            <circle id="wheelArc" cx="100" cy="100" r="90" fill="none" stroke="url(#gradRed)" stroke-width="8" 
                    stroke-dasharray="565" stroke-dashoffset="565" stroke-linecap="round" 
                    transform="rotate(-90 100 100)" style="transition: stroke-dashoffset 0.8s ease, stroke 0.8s ease;"/>
            
            <!-- Стрелка снизу -->
            <polygon points="100,195 95,185 105,185" fill="#ffd93b" />
          </svg>
          
          <!-- Иконка внутри -->
          <div class="wheel-icon" id="wheelIcon">🍌</div>
        </div>

        <!-- Настройки апгрейда -->
        <div class="upgrade-controls">
          <div class="multiplier-buttons">
            <button class="mult-btn" data-mult="1.5">x1.5</button>
            <button class="mult-btn active" data-mult="2">x2</button>
            <button class="mult-btn" data-mult="5">x5</button>
            <button class="mult-btn" data-mult="10">x10</button>
          </div>
          <div class="chance-display">Шанс: <span id="chanceText">50%</span></div>
          <button class="btn primary" id="upgradeBtn" style="width: 100%; font-size: 16px; padding: 14px;">Улучшить</button>
        </div>
      </div>

      <!-- Инвентарь -->
      <h3 style="margin-top: 24px; margin-bottom: 12px; font-size: 18px;">Инвентарь</h3>
      <div class="inventory-list" id="inventoryList">
        <!-- Предметы будут добавлены через JS -->
      </div>
    </section>
