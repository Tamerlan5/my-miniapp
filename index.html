<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bee Tap 🐝</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- Верхняя панель -->
  <header class="topbar" id="mainTopbar">
    <div class="stat">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      <span id="balance">0</span>
    </div>
    <div class="stat">
      <svg class="ico" viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      <span id="energy">1000/1000</span>
    </div>
  </header>

  <!-- Контент страниц -->
  <main id="app">
    <!-- TAP -->
    <section id="page-tap" class="page active">
      <div class="tap-zone" id="tapZone">
        <div class="banana" id="banana">
          <svg viewBox="0 0 100 100">
            <path d="M20 70 Q15 40 50 25 Q85 15 80 45 Q78 70 50 80 Q30 85 20 70 Z" fill="#FFD93B" stroke="#E0A800" stroke-width="3"/>
            <path d="M50 25 Q55 20 60 25" stroke="#8B5E00" stroke-width="3" fill="none"/>
          </svg>
        </div>
        <div class="tap-hint">ТАПАЙ ПО СОТАМ!</div>
      </div>
      
      <div class="quick-actions">
        <div class="action-card" onclick="switchPage('shop')">
          <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12L8.1 13h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1z"/></svg>
          <span>Магазин</span>
        </div>
        <div class="action-card" onclick="switchPage('mine')">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/></svg>
          <span>Пасека</span>
        </div>
      </div>
    </section>

        <!-- UPGRADES (АПГРЕЙДЕР) -->
    <section id="page-boosts" class="page">
      <div class="upgrader-layout">
        
        <!-- Верхняя часть с колесом -->
        <div class="wheel-top-section">
          <div class="wheel-container">
            <div class="wheel-glow"></div>
            
            <svg class="wheel-svg" viewBox="0 0 200 200">
              <defs>
                <linearGradient id="gradGrey" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#2a2826" />
                  <stop offset="100%" stop-color="#141312" />
                </linearGradient>
                <linearGradient id="gradYellow" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffe066" />
                  <stop offset="100%" stop-color="#f5b700" />
                </linearGradient>
              </defs>
              
              <circle cx="100" cy="100" r="90" fill="#0e0d0b" stroke="#1a1816" stroke-width="2"/>
              <circle cx="100" cy="100" r="85" fill="none" stroke="url(#gradGrey)" stroke-width="10"/>
              
              <circle id="winSector" cx="100" cy="100" r="85" fill="none" stroke="url(#gradYellow)" stroke-width="10" 
                      stroke-dasharray="0 534" stroke-dashoffset="0" 
                      transform="rotate(-90 100 100)" 
                      style="transition: stroke-dasharray 0.3s ease;"/>
            </svg>
            
            <div class="wheel-center-item" id="wheelIcon">🍌</div>
            
            <div class="wheel-arrow" id="wheelArrow">
              <svg viewBox="0 0 24 24">
                <path d="M12 21L6 9h12L12 21z" fill="#ffd93b" />
                <rect x="9" y="2" width="6" height="7" rx="2" fill="#ffd93b"/>
                <path d="M12 21L6 9h12L12 21z" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Место под картинку-баннер -->
        <div class="banner-image-placeholder">
          <div class="banner-overlay"></div>
        </div>

        <!-- Стеклянная панель снизу -->
        <div class="glass-panel">
          <div class="upgrade-panel">
            <div class="multiplier-grid">
              <button class="mult-btn" data-mult="1.5">x1.5</button>
              <button class="mult-btn active" data-mult="2">x2</button>
              <button class="mult-btn" data-mult="5">x5</button>
              <button class="mult-btn" data-mult="10">x10</button>
            </div>
            
            <div class="chance-info">
              Шанс успеха: <span id="chanceText">50%</span>
            </div>
            
            <!-- Кнопка-ползунок -->
            <div class="slider-container" id="sliderContainer">
              <div class="slider-track">
                <div class="slider-fill" id="sliderFill"></div>
                <span class="slider-text" id="sliderText">SWIPE TO UPGRADE</span>
                <div class="slider-thumb" id="sliderThumb">
                  <svg viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" stroke="#0a0908" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <!-- Инвентарь -->
          <div class="inventory-section">
            <div class="inventory-header">
              <h3>Ваш инвентарь</h3>
              <span class="items-count" id="invCount">6 предметов</span>
            </div>
            <div class="inventory-list" id="inventoryList"></div>
          </div>
        </div>

      </div>
    </section>

    <!-- TASKS -->
    <section id="page-tasks" class="page">
      <h2>Задания</h2>
      <div id="taskList" class="card-list"></div>
    </section>

    <!-- FRIENDS -->
    <section id="page-friends" class="page">
      <h2>Друзья</h2>
      <p class="muted">Пригласи друга в улей и получи 5000 меда 🍯</p>
      <button class="btn primary" id="inviteBtn" style="width:100%; margin-top: 10px;">Пригласить друга</button>
      <div class="ref-box"><span id="refLink">—</span></div>
      <p class="muted">Приглашено: <b id="refCount">0</b></p>
    </section>

    <!-- MINE / PASSIVE -->
    <section id="page-mine" class="page">
      <h2>Пасека (доход)</h2>
      <div id="mineList" class="card-list"></div>
    </section>

    <!-- SHOP -->
    <section id="page-shop" class="page">
      <h2>Магазин</h2>
      <div id="shopList" class="card-list"></div>
    </section>

    <!-- PROFILE -->
    <section id="page-profile" class="page">
      <h2>Профиль</h2>
      <div class="profile-card">
        <div class="avatar" id="avatar">🐝</div>
        <div>
          <div id="userName">Игрок</div>
          <div class="muted" id="userId">—</div>
        </div>
      </div>
      <button class="btn danger" id="resetBtn" style="width:100%;">Сбросить прогресс</button>
    </section>
  </main>

  <!-- Нижнее меню -->
  <nav class="bottomnav">
    <button data-page="friends" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      <span>Друзья</span>
    </button>
    <button data-page="boosts" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      <span>Апгрейд</span>
    </button>
    
    <button data-page="tap" class="nav-btn center-btn active">
      <div class="center-btn-inner">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" fill="#0a0908"/>
          <circle cx="12" cy="12" r="4" fill="#0a0908"/>
        </svg>
      </div>
    </button>

    <button data-page="tasks" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <span>Задания</span>
    </button>
    <button data-page="profile" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Профиль</span>
    </button>
  </nav>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
