<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое тестовое приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f0f0f0; }
        h1 { color: #333; }
        #user-name { color: #007bff; }
    </style>
</head>
<body>
    <h1>Привет, <span id="user-name">гость</span>!</h1>
    <p>Это мое первое мини-приложение.</p>
    <button id="test-btn">Нажми меня</button>
    <p id="result"></p>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        const user = tg.initDataUnsafe.user;
        if (user) { document.getElementById('user-name').innerText = user.first_name; }
        document.getElementById('test-btn').addEventListener('click', () => {
            document.getElementById('result').innerText = 'Кнопка работает!';
            tg.HapticFeedback.impactOccurred('light');
        });
    </script>
</body>
</html>
