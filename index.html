<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROJECT PROFIT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent: #ff3b30;
            --text: #ffffff;
            --text-muted: #888888;
            --glass-bg: rgba(25, 25, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-bg: #161616;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            -ms-overflow-style: none; scrollbar-width: none;
            overflow-y: scroll; overflow-x: hidden; min-height: 100vh;
        }
        body::-webkit-scrollbar { display: none; }

        .bg-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.03; pointer-events: none; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 30%, #000000 120%); pointer-events: none; z-index: 0; }

        .pages-container { position: relative; z-index: 1; width: 100%; min-height: 100vh; padding-top: 85px; padding-bottom: 120px; }
        .page { display: none; flex-direction: column; align-items: center; padding: 10px 20px 30px; width: 100%; min-height: 100vh; animation: fadeIn 0.4s ease forwards; }
        .page.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 24px; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; border: 1px solid var(--glass-border); margin-bottom: 20px; }

        /* --- Профиль --- */
        .avatar { 
            width: 80px; height: 80px; border-radius: 50%; background: #333; 
            margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; 
            font-size: 32px; font-weight: bold; color: #fff; border: 2px solid #444;
            background-size: cover; background-position: center;
        }
        .username { font-size: 24px; font-weight: 800; margin-bottom: 4px; display: inline-block; text-align: center; width: 100%; }
        .user-rank-badge { 
            display: block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; 
            text-transform: uppercase; letter-spacing: 0.5px; margin: 0 auto 16px; 
            background: rgba(255,255,255,0.1); width: fit-content; 
        }
        
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .stat-row:last-child { border-bottom: none; }
        .stat-row span:first-child { color: var(--text-muted); }
        .stat-row span:last-child { font-weight: 700; color: var(--accent); }

        /* --- Форма --- */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 700; }
        .form-group input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 14px; color: var(--text); font-size: 16px; outline: none; transition: border 0.3s;
        }
        .form-group input:focus { border-color: var(--accent); }
        
        .btn-submit {
            width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 12px;
            padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
        }
        .btn-submit:active { opacity: 0.8; }

        .recent-list { margin-top: 24px; width: 100%; max-width: 400px; }
        .recent-list h3 { font-size: 14px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; font-weight: 700; }
        .recent-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .recent-item .info { display: flex; flex-direction: column; gap: 4px; }
        .recent-item .name { font-weight: 600; font-size: 15px; }
        .recent-item .date { font-size: 11px; color: var(--text-muted); }
        .recent-item .count { background: rgba(255, 59, 48, 0.15); color: var(--accent); padding: 4px 10px; border-radius: 10px; font-weight: 700; font-size: 14px; }

        /* --- Градиенты рангов --- */
        .rank-gray { color: #888888; } /* Начинающий */
        .rank-blue { background: linear-gradient(90deg, #3b82f6, #06b6d4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; } /* Батя */
        .rank-red { background: linear-gradient(90deg, #ef4444, #ff8a00); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; } /* Со стажем */
        .rank-green { background: linear-gradient(90deg, #22c55e, #10b981); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; } /* Профи */
        .rank-pink { background: linear-gradient(90deg, #ec4899, #f472b6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; } /* Старший менеджер */

        .badge-gray { background: rgba(136, 136, 136, 0.2); color: #888888; }
        .badge-blue { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .badge-red { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-green { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge-pink { background: rgba(236, 72, 153, 0.2); color: #ec4899; }

        /* --- Главная --- */
        .main-brand { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 24px; text-align: center; width: 100%; }
        .brand-title { font-size: 36px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; }
        .brand-title .project { background: linear-gradient(90deg, #ff3b30, #ff8a00, #ff3b30); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: gradientMove 3s linear infinite; }
        .brand-title .profit { color: var(--text); }
        .brand-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }
        @keyframes gradientMove { to { background-position: 200% center; } }

        /* --- Меню --- */
        .nav-container { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 0; width: 100%; display: flex; justify-content: center; z-index: 100; }
        .glass-nav { display: flex; justify-content: space-between; align-items: center; background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 40px; padding: 8px 12px; width: 88%; max-width: 320px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); position: relative; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; height: 55px; border-radius: 50%; position: relative; z-index: 2; cursor: pointer; transition: transform 0.2s; gap: 4px; }
        .nav-item:active { transform: scale(0.9); }
        .nav-item svg { width: 22px; height: 22px; fill: none; stroke: #666666; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.3s; }
        .nav-item span { font-size: 10px; color: #666666; font-weight: 500; transition: color 0.3s; }
        .nav-item.active svg { stroke: var(--accent); }
        .nav-item.active span { color: var(--accent); }
        .slider { position: absolute; width: 60px; height: 55px; background: rgba(255, 59, 48, 0.1); border-radius: 30px; top: 8px; left: 12px; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s; z-index: 1; opacity: 0; border: 1px solid rgba(255, 59, 48, 0.2); }
        .slider.ready { opacity: 1; }
    </style>
</head>
<body>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        try { if (tg.isVersionAtLeast('8.0')) tg.requestFullscreen(); } catch(e) {}
        tg.setHeaderColor('#0a0a0a'); tg.setBackgroundColor('#0a0a0a');

        const tgUser = tg.initDataUnsafe?.user;
        const currentUser = {
            name: tgUser?.first_name || "Сотрудник",
            username: tgUser?.username || "",
            photo: tgUser?.photo_url || null
        };
    </script>

    <svg class="bg-lines" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="diagonalHatch" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="40" stroke="#ffffff" stroke-width="1" /></pattern></defs><rect width="100%" height="100%" fill="url(#diagonalHatch)" /><circle cx="10%" cy="20%" r="150" stroke="#ffffff" stroke-width="1" fill="none" /><circle cx="90%" cy="80%" r="200" stroke="#ffffff" stroke-width="1" fill="none" /></svg>
    <div class="vignette"></div>

    <div class="pages-container">
        <!-- Профиль -->
        <div class="page" id="page-profile">
            <div class="card" style="text-align: center;">
                <div class="avatar" id="profile-avatar"></div>
                <div class="username" id="profile-name">Загрузка...</div>
                <div class="user-rank-badge" id="profile-rank-badge">ЗАГРУЗКА</div>
                
                <div style="text-align: left; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 16px; margin-top: 16px;">
                    <h4 style="margin-bottom: 8px; font-size: 14px; color: var(--text-muted); text-transform: uppercase;">Моя статистика</h4>
                    <div class="stat-row"><span>Клиентов обработано:</span> <span id="stat-clients">0</span></div>
                    <div class="stat-row"><span>Общий профит (20%):</span> <span id="stat-profit">0 ₽</span></div>
                </div>
            </div>
        </div>

        <!-- Главная (Форма) -->
        <div class="page active" id="page-main">
            <div class="main-brand">
                <div class="brand-title">
                    <span class="project">PROJECT</span><br>
                    <span class="profit">PROFIT</span>
                </div>
                <div class="brand-subtitle">CRM для команды</div>
            </div>

            <div class="card">
                <h2 style="font-size: 18px; margin-bottom: 16px;">Новая запись</h2>
                <div class="form-group">
                    <label>Юзернейм клиента</label>
                    <input type="text" id="input-username" placeholder="@username" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Количество мемберов</label>
                    <input type="number" id="input-count" placeholder="0" min="1" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Стоимость (в рублях)</label>
                    <input type="number" id="input-cost" placeholder="0" min="0" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Дата</label>
                    <input type="text" id="input-date" readonly style="opacity: 0.7;">
                </div>
                <button class="btn-submit" onclick="addRecord()">Зафиксировать</button>
            </div>

            <div class="recent-list">
                <h3>Последние записи</h3>
                <div id="recent-container"></div>
            </div>
        </div>

        <!-- База -->
        <div class="page" id="page-news">
            <h2>Общая база</h2>
            <p style="color: var(--text-muted); font-size: 14px; text-align: center; margin-top: 10px;">
                Здесь будет отображаться общая статистика команды и рейтинг сотрудников.
            </p>
        </div>
    </div>

    <div class="nav-container">
        <div class="glass-nav" id="nav">
            <div class="slider" id="slider"></div>
            <div class="nav-item" onclick="changeTab(0, this)">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Профиль</span>
            </div>
            <div class="nav-item active" onclick="changeTab(1, this)">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Работа</span>
            </div>
            <div class="nav-item" onclick="changeTab(2, this)">
                <svg viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8M15 18h-5M10 6h8v4h-8V6Z"></path></svg>
                <span>База</span>
            </div>
        </div>
    </div>

    <script>
        // --- ИНИЦИАЛИЗАЦИЯ ПРОФИЛЯ ---
        document.getElementById('profile-name').textContent = currentUser.name;
        
        // Аватарка
        const avatarDiv = document.getElementById('profile-avatar');
        if (currentUser.photo) {
            avatarDiv.style.backgroundImage = `url(${currentUser.photo})`;
        } else {
            avatarDiv.textContent = currentUser.name.charAt(0).toUpperCase();
        }

        // --- ЛОГИКА РАНГОВ ---
        function getRankData(clientsCount) {
            if (clientsCount >= 60) return { name: 'Старший менеджер', textClass: 'rank-pink', badgeClass: 'badge-pink' };
            if (clientsCount >= 30) return { name: 'Профи', textClass: 'rank-green', badgeClass: 'badge-green' };
            if (clientsCount >= 15) return { name: 'Со стажем', textClass: 'rank-red', badgeClass: 'badge-red' };
            if (clientsCount >= 5) return { name: 'Батя', textClass: 'rank-blue', badgeClass: 'badge-blue' };
            return { name: 'Начинающий', textClass: 'rank-gray', badgeClass: 'badge-gray' };
        }

        function updateProfileStats() {
            // Считаем общее количество клиентов (сумма всех мемберов)
            let totalClients = records.reduce((sum, rec) => sum + parseInt(rec.count), 0);
            // Считаем общий профит (20% от суммы всех стоимостей)
            let totalProfit = records.reduce((sum, rec) => sum + (parseInt(rec.cost) || 0) * 0.2, 0);

            // Обновляем цифры
            document.getElementById('stat-clients').textContent = totalClients;
            document.getElementById('stat-profit').textContent = Math.round(totalProfit).toLocaleString('ru-RU') + ' ₽';

            // Выдаем ранг
            const rank = getRankData(totalClients);
            
            const nameElement = document.getElementById('profile-name');
            nameElement.className = `username ${rank.textClass}`;
            
            const badgeElement = document.getElementById('profile-rank-badge');
            badgeElement.textContent = rank.name.toUpperCase();
            badgeElement.className = `user-rank-badge ${rank.badgeClass}`;
        }

        // --- ЛОГИКА МЕНЮ ---
        const slider = document.getElementById('slider');
        const navItems = document.querySelectorAll('.nav-item');
        const pages = document.querySelectorAll('.page');
        let stepWidth = 0;
        let currentIndex = 1;

        const today = new Date().toLocaleDateString('ru-RU');
        document.getElementById('input-date').value = today;

        function calculateStepWidth() {
            if (navItems.length < 2) return;
            const firstCenter = navItems[0].offsetLeft + navItems[0].offsetWidth / 2;
            const secondCenter = navItems[1].offsetLeft + navItems[1].offsetWidth / 2;
            stepWidth = secondCenter - firstCenter;
        }

        function changeTab(index, element) {
            navItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const offset = stepWidth * index;
            slider.style.transform = `translateX(${offset}px)`;
            pages.forEach(page => page.classList.remove('active'));
            if (index === 0) document.getElementById('page-profile').classList.add('active');
            if (index === 1) {
                const mainPage = document.getElementById('page-main');
                mainPage.classList.add('active');
                const brand = mainPage.querySelector('.main-brand');
                brand.style.animation = 'none'; brand.offsetHeight; brand.style.animation = null;
            }
            if (index === 2) document.getElementById('page-news').classList.add('active');
        }

        // --- РАБОТА С ЗАПИСЯМИ ---
        let records = JSON.parse(localStorage.getItem('profit_records')) || [];

        function renderRecords() {
            const container = document.getElementById('recent-container');
            container.innerHTML = '';
            
            records.slice(0, 5).forEach(rec => {
                const div = document.createElement('div');
                div.className = 'recent-item';
                div.innerHTML = `
                    <div class="info">
                        <span class="name">${rec.username}</span>
                        <span class="date">${rec.date} • ${rec.cost} ₽</span>
                    </div>
                    <div class="count">${rec.count} чел.</div>
                `;
                container.appendChild(div);
            });

            updateProfileStats(); // Обновляем профиль при каждом рендере
        }

        function addRecord() {
            const usernameInput = document.getElementById('input-username');
            const countInput = document.getElementById('input-count');
            const costInput = document.getElementById('input-cost');
            
            const username = usernameInput.value.trim();
            const count = countInput.value.trim();
            const cost = costInput.value.trim();
            const date = document.getElementById('input-date').value;

            if (!username || !count || count <= 0 || !cost || cost <= 0) {
                tg.showAlert("Пожалуйста, заполните все поля корректно.");
                return;
            }

            const newRecord = { username, count, cost, date };
            records.unshift(newRecord);
            localStorage.setItem('profit_records', JSON.stringify(records));

            usernameInput.value = '';
            countInput.value = '';
            costInput.value = '';

            renderRecords();

            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert("Запись успешно добавлена!");
        }

        window.addEventListener('load', () => {
            calculateStepWidth();
            const offset = stepWidth * 1;
            slider.style.transform = `translateX(${offset}px)`;
            slider.classList.add('ready');
            renderRecords();
        });

        window.addEventListener('resize', () => {
            calculateStepWidth();
            const offset = stepWidth * currentIndex;
            slider.style.transform = `translateX(${offset}px)`;
        });
    </script>
</body>
</html>
